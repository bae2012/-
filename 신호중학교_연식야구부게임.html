<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9fd3f2"><meta name="description" content="주장이 되어 열흘간 팀을 키우고 대회 우승에 도전하는 3D 야구 육성 게임"><title>신호중학교 3D 육성 스토리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#9fd3f2;
  --ink:#14283d;
  --ink-soft:#14283d;
  --paper:#fbf8ee;
  --paper2:#ebe4cf;
  --line:#14283d26;
  --sun:#ffc531;
  --sun-ink:#2b1f00;
  --seam:#d9453d;
  --field:#2f7d4f;
  --board:#123829;
  --chalk:#f4f1e4;
  --red:#e5484d;
  --blue:#2f6fed;
  --green:#2fb36b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1b2a;
    --ink:#f4f1e4;
    --ink-soft:#000;
    --paper:#18283a;
    --paper2:#22364b;
    --line:#f4f1e426;
    --seam:#ff7a70;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1b2a;--ink:#f4f1e4;--ink-soft:#000;--paper:#18283a;--paper2:#22364b;--line:#f4f1e426;--seam:#ff7a70;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.jua{font-family:'Jua','Noto Sans KR',sans-serif}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.screen>*{pointer-events:auto}
.card{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;
  padding:22px 24px;width:min(560px,94vw);max-height:88vh;overflow:auto;box-shadow:0 8px 0 var(--ink-soft)}
.card::after{content:'';position:absolute;inset:7px;border:2px dashed var(--seam);border-radius:14px;pointer-events:none;opacity:.5}
.card h2{font-family:'Jua';font-weight:400;font-size:28px;margin:0 0 8px;line-height:1.2}
.card p{margin:6px 0;line-height:1.6;font-size:15px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:2}
.btn{font-family:'Jua','Noto Sans KR',sans-serif;font-size:19px;padding:10px 20px;border:3px solid var(--ink);background:var(--sun);
  color:var(--sun-ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--paper2);color:var(--ink)}
.btn.big{font-size:24px;padding:14px 34px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* 타이틀 */
#scrTitle{align-items:flex-end;justify-content:flex-start}
#scrTitle .hero{margin:0 0 6vh 4vw;max-width:min(560px,92vw)}
.logo{font-family:'Jua';color:#fff;line-height:.95;margin:0;text-shadow:0 5px 0 #14283d,0 0 22px #14283d66;-webkit-text-stroke:3px #14283d;paint-order:stroke fill}
.logo .l1{display:block;font-size:clamp(54px,12vw,112px)}
.logo .l2{display:block;font-size:clamp(28px,6vw,52px);color:var(--sun);margin-top:6px}
.sub{color:#fff;font-weight:700;text-shadow:0 2px 6px #000a;margin:16px 0 22px;font-size:16px;line-height:1.5}

/* 캐릭터 선택 */
#scrSelect{flex-direction:column;gap:14px;background:linear-gradient(#0008,#0004)}
#scrSelect h2{font-family:'Jua';font-weight:400;color:#fff;font-size:30px;margin:0;text-shadow:0 3px 0 #14283d}
.cards{display:flex;gap:12px;overflow-x:auto;max-width:100%;padding:8px 6px 14px;scroll-snap-type:x proximity}
.pc{flex:0 0 200px;scroll-snap-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px;cursor:pointer;
  box-shadow:0 6px 0 var(--ink-soft);position:relative;text-align:left}
.pc:hover{transform:translateY(-3px)}
.pc .av{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-family:'Jua';font-size:24px;color:#fff;margin-bottom:8px}
.pc .nm{font-family:'Jua';font-size:22px}
.pc .rl{font-size:13px;opacity:.75;margin-bottom:8px}
.pc .bio{font-size:12.5px;line-height:1.45;margin:8px 0 0;opacity:.85;min-height:52px}
.bar{display:grid;grid-template-columns:3em 1fr 2.1em;gap:6px;align-items:center;font-size:12px;margin:3px 0}
.bar i{display:block;height:7px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--field);border-radius:4px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* 캠프 */
#scrCamp{align-items:stretch;justify-content:space-between;flex-direction:column;padding:0}
.topbar{display:flex;gap:10px;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0;flex-wrap:wrap}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 5px 0 var(--ink-soft)}
.days{display:flex;gap:5px;margin-top:6px}
.days i{width:17px;height:17px;border-radius:50%;border:2px solid var(--ink);background:transparent;display:block}
.days i.done{background:var(--field)}
.days i.now{background:var(--sun);transform:scale(1.25)}
.dayt{font-family:'Jua';font-size:22px}
.stats{min-width:190px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px))}
.act{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;min-width:132px;text-align:left;cursor:pointer;box-shadow:0 5px 0 var(--ink-soft)}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink-soft)}
.act b{font-family:'Jua';font-weight:400;font-size:19px;display:block}
.act small{font-size:12px;opacity:.75}
.condwrap{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px}
.cond{flex:1;height:9px;border-radius:5px;background:var(--line);overflow:hidden;min-width:90px}
.cond b{display:block;height:100%;background:var(--green)}
.friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px;position:relative;z-index:2}
.fr{border:3px solid var(--ink);background:var(--paper2);border-radius:14px;padding:10px;cursor:pointer;text-align:left}
.fr:hover{background:var(--sun);color:var(--sun-ink)}
.fr b{font-family:'Jua';font-weight:400;font-size:18px}
.fr small{display:block;opacity:.75}
.heart{color:var(--seam);letter-spacing:1px}
.log li{margin:4px 0}

/* 모달 */
#modal{background:#0007;z-index:20;pointer-events:auto}

/* 경기 HUD */
.board{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));background:var(--board);color:var(--chalk);
  border:3px solid #e9e3c8;border-radius:14px;padding:8px 12px;font-family:'Jua';display:flex;gap:14px;align-items:center;box-shadow:0 5px 0 #0007;z-index:5}
.board .inn{font-size:22px;text-align:center;line-height:1}
.board .inn small{display:block;font-size:12px;opacity:.7;font-family:'Noto Sans KR'}
.trow{display:flex;justify-content:space-between;gap:14px;font-size:17px;min-width:130px}
.trow b{font-size:22px;font-weight:400}
.lamps{display:flex;align-items:center;gap:5px;font-size:13px;margin:2px 0}
.lamps em{font-style:normal;width:12px;opacity:.8}
.lamps span{width:11px;height:11px;border-radius:50%;background:#ffffff26;display:block}
.lamps.B span.on{background:#48d17f}.lamps.S span.on{background:#ffd23d}.lamps.O span.on{background:#ff5a52}
.dia{width:54px;height:54px}
.dia rect{fill:#ffffff26;stroke:#e9e3c8;stroke-width:1.5}
.dia rect.on{fill:var(--sun)}
#batterCard{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;max-width:min(300px,46vw)}
#batterCard .nm{font-family:'Jua';font-size:19px}
#batterCard small{opacity:.8;font-size:12px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));background:#000a;color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;z-index:4;text-align:center;max-width:90vw;pointer-events:none}
#call{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-family:'Jua';font-size:clamp(44px,10vw,92px);color:#fff;
  -webkit-text-stroke:4px #14283d;paint-order:stroke fill;text-shadow:0 6px 0 #14283d;pointer-events:none;z-index:8;white-space:nowrap;transition:transform .18s cubic-bezier(.3,1.6,.5,1),opacity .12s}
#call.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#call.strike{color:#ff6a62}#call.ball{color:#6db4ff}#call.foul{color:#ffd23d}#call.good{color:#5be08e}#call.bad{color:#c8c8c8}#call.run{color:var(--sun)}
#zoneBox{position:fixed;border:3px dashed #fff;border-radius:4px;box-shadow:0 0 0 1px #14283d99,inset 0 0 0 1px #14283d99;pointer-events:none;z-index:3}
#zoneBox::before,#zoneBox::after{content:'';position:absolute;background:#ffffff66}
#zoneBox::before{left:33.3%;right:33.3%;top:0;bottom:0;background:none;border-left:1px solid #ffffff66;border-right:1px solid #ffffff66}
#zoneBox::after{top:33.3%;bottom:33.3%;left:0;right:0;background:none;border-top:1px solid #ffffff66;border-bottom:1px solid #ffffff66}
#reticle{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border:3px solid var(--sun);border-radius:50%;pointer-events:none;z-index:4;box-shadow:0 0 0 2px #14283d99}
#reticle::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:var(--sun);border-radius:50%}
.trace{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:4px solid #fff;pointer-events:none;z-index:6;font-family:'Jua';font-size:14px;color:#fff;display:flex;align-items:center;justify-content:center}
.trace.S{background:var(--red)}.trace.B{background:var(--blue)}

#pitchUI{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#aimPanel{position:relative;width:clamp(138px,24vw,210px);aspect-ratio:1.3/1.55;background:#0e2a1fcc;border:3px solid var(--chalk);border-radius:12px;touch-action:none;cursor:crosshair}
#aimZone{position:absolute;border:2px dashed var(--chalk);pointer-events:none}
#aimZone::before,#aimZone::after{content:'';position:absolute}
#aimZone::before{left:33.3%;right:33.3%;top:0;bottom:0;border-left:1px solid #f4f1e455;border-right:1px solid #f4f1e455}
#aimZone::after{top:33.3%;bottom:33.3%;left:0;right:0;border-top:1px solid #f4f1e455;border-bottom:1px solid #f4f1e455}
#aimDot{position:absolute;width:12px;height:12px;margin:-6px;background:var(--sun);border-radius:50%;pointer-events:none;border:2px solid #14283d}
#aimSig{position:absolute;border:2px solid #ffc53199;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
#traceP{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;border:3px solid #fff;pointer-events:none}
#traceP.S{background:var(--red)}#traceP.B{background:var(--blue)}
.pbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(340px,60vw)}
.pbtn{font-family:'Jua';font-size:15px;padding:8px 10px;border:3px solid var(--ink);background:var(--paper2);color:var(--ink);border-radius:12px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.pbtn.sel{background:var(--sun);color:var(--sun-ink)}
.pbtn small{display:block;font-family:'Noto Sans KR';font-size:10px;opacity:.75}
.stam{display:flex;gap:6px;align-items:center;color:#fff;font-size:12px;text-shadow:0 1px 3px #000}
.stam i{display:block;width:90px;height:8px;border-radius:4px;background:#ffffff33;overflow:hidden}
.stam b{display:block;height:100%;background:var(--green)}

#mute{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:30;width:44px;height:44px;border-radius:50%;
  border:3px solid var(--ink);background:var(--paper);cursor:pointer;font-size:18px;box-shadow:0 3px 0 var(--ink-soft)}
@media (max-width:640px){
  .board{padding:6px 9px;gap:9px}.trow{min-width:96px;font-size:14px}.trow b{font-size:18px}.dia{width:42px;height:42px}
  .card{padding:18px 18px}.pc{flex-basis:176px}.act{min-width:calc(50% - 8px)}.stats{min-width:150px}
  #hint{bottom:calc(64px + env(safe-area-inset-bottom,0px));font-size:12px}
}
@media (prefers-reduced-motion: reduce){#call{transition:none}}
.gc{width:150px;height:200px;margin:10px auto;border:5px solid #8a94a3;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:64px;background:#0002;transition:all .3s}
.gc.shake{animation:shk .18s infinite}.gc.flip{animation:flp .5s}
@keyframes shk{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,2px) rotate(-3deg)}75%{transform:translate(4px,-2px) rotate(3deg)}}
@keyframes flp{0%{transform:rotateY(90deg) scale(.8)}100%{transform:rotateY(0) scale(1)}}

/* 선수 얼굴(누끼) */
.pc .av{width:72px;height:72px;overflow:hidden;position:relative;background-clip:padding-box}
.pc .av img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;pointer-events:none;-webkit-user-drag:none}
.gc img{width:100%;height:100%;object-fit:contain;display:block;border-radius:10px}
.fcs{display:inline-block;width:34px;height:34px;border-radius:50%;overflow:hidden;vertical-align:middle;margin-right:6px;border:2px solid currentColor;background:#0001}
.fcs img{width:100%;height:100%;object-fit:cover;display:block}

/* 컴프야 스타일 선수 카드 */
.pro{--c:#8a94a3;position:relative;width:100%;max-width:200px;margin:0 auto;border-radius:14px;padding:5px;color:#fff;text-align:left;
 background:linear-gradient(160deg,var(--c),#1b1f2a 70%);border:3px solid var(--c);box-shadow:0 4px 12px #0006,inset 0 0 14px #fff3;overflow:hidden}
.pro::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#fff4 48%,transparent 60%);background-size:250% 100%;animation:proShine 3.2s infinite;pointer-events:none}
.pro.SSR{box-shadow:0 0 18px var(--c),inset 0 0 18px #fff6}.pro.SSR::before{animation-duration:1.6s}
@keyframes proShine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.pro-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:3px}
.pro .gr{background:var(--c);color:#fff;padding:1px 8px;border-radius:8px;font-family:'Jua';font-size:14px;text-shadow:0 1px 2px #0008}
.pro .ps{background:#0007;padding:1px 7px;border-radius:8px}
.pro-img{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:2px solid #fff8;display:flex;align-items:center;justify-content:center}
.pro-img img{width:100%;height:100%;object-fit:cover;display:block}
.pro-img i{font-style:normal;font-family:'Jua';font-size:64px;color:#fff;text-shadow:0 2px 6px #0008}
.pro .ovr{position:absolute;left:10px;top:36px;font-family:'Jua';font-size:26px;line-height:1;text-shadow:0 2px 4px #000,0 0 8px var(--c)}
.pro .ovr small{display:block;font-size:9px;opacity:.85}
.pro-nm{font-family:'Jua';font-size:19px;text-align:center;margin:4px 0 2px;text-shadow:0 1px 3px #000}
.pro-stars{text-align:center;color:#ffd84a;font-size:12px;letter-spacing:1px;margin-bottom:2px}
.pro-st{display:flex;justify-content:space-around;background:#0006;border-radius:8px;padding:3px 2px;font-size:11px;text-align:center}
.pro-st b{display:block;font-size:15px;font-family:'Jua'}
.pc.pcx{padding:0;border:0;background:none;box-shadow:none}.pc.pcx .bio{padding:0 4px}.pc.pcx .nm2{font-size:12px;opacity:.75;text-align:center;margin:4px 0}
.gc.pg{width:200px;height:auto;padding:0;font-size:14px;border-color:transparent!important;background:none!important}

#runBox{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;pointer-events:none}
#runBox .rbx{pointer-events:auto;background:#fffbe8;border:3px solid #222;border-radius:16px;padding:12px 16px;text-align:center;min-width:240px;box-shadow:0 6px 0 #0003}
#runBox .rbar,#runBox .rtm{height:14px;background:#0002;border-radius:8px;overflow:hidden;margin:8px 0}
#runBox .rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ad07a,#ffd84a)}
#runBox .rtm i{display:block;height:100%;width:100%;background:#e5484d;transform-origin:left;animation:rtm linear forwards}
@keyframes rtm{to{transform:scaleX(0)}}

/* ===== 모바일/가로모드 겹침 수정 ===== */
html,body{overscroll-behavior:none}
.card{max-height:88vh}@supports(height:100dvh){.card{max-height:88dvh}}
.btnrow .btn{flex:1 1 150px;text-align:center}
#scrSelect{justify-content:safe center;overflow-y:auto;gap:10px}
#scrSelect h2{font-size:clamp(22px,5vw,30px);text-align:center}
#scrSelect>p{text-align:center;max-width:640px;padding:0 8px}
.cards{flex:0 0 auto}
.topbar{padding-right:calc(64px + env(safe-area-inset-right,0px))}
#statsBox{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
#statsBox>div:not(.bar){grid-column:1/-1}
@media (max-width:900px){
  #hint{top:calc(96px + env(safe-area-inset-top,0px));bottom:auto;left:10px;transform:none;max-width:min(300px,56vw);text-align:left;font-size:12px}
  #camBtn{top:calc(62px + env(safe-area-inset-top,0px))!important;right:calc(10px + env(safe-area-inset-right,0px))!important}
  #stealBtn,#pickBtn{right:auto!important;left:calc(10px + env(safe-area-inset-left,0px))!important;bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
  #runBox{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #runBox .rbx{max-width:92vw}
}
@media (max-width:420px){.dayt{font-size:16px}.stats{min-width:0}.topbar .panel{max-width:100%}.logo .l1{-webkit-text-stroke:2px #14283d}}
@media (max-height:520px){
  .topbar .panel{padding:6px 9px}.dayt{font-size:16px}
  #aimPanel{width:96px}.pbtn{padding:4px 7px;font-size:12px}.pbtn small{display:none}.pbtns{max-width:min(280px,46vw)}.stam{display:none}
  .btn{font-size:16px;padding:7px 14px}.pc{flex-basis:150px}.pro-img{aspect-ratio:4/3}
  .card{padding:14px 16px}.card h2{font-size:22px}.card p{font-size:14px}
  #scrTitle .hero{margin-bottom:3vh}.sub{margin:8px 0 12px;font-size:14px}
}

/* ===== 퀄리티 업그레이드: 중계 화면 스타일 ===== */
canvas#c{filter:saturate(1.16) contrast(1.05)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 58%,#00000040 100%)}
.board{background:linear-gradient(180deg,#22365a,#0b1424);border:0;border-left:6px solid var(--sun);border-radius:6px 16px 16px 6px;box-shadow:0 8px 22px #000a,inset 0 0 0 1px #ffffff22;color:#fff}
.board .trow b{background:#fff;color:#0b1424;border-radius:5px;padding:0 8px;min-width:32px;text-align:center;font-size:20px}
.board .inn{color:var(--sun)}
.lamps span{box-shadow:inset 0 0 0 1px #ffffff40}.lamps.B span.on{box-shadow:0 0 9px #48d17f}.lamps.S span.on{box-shadow:0 0 9px #ffd23d}.lamps.O span.on{box-shadow:0 0 9px #ff5a52}

/* ---------- 게임 상태 ---------- */
let S = null; // 스토리 상태
let roster = [];
function newGame() {
  roster = PLAYERS.map((p, i) => ({ id: i, name: p.name, role: p.role, color: p.color, npc: !!p.npc, talk: p.talk, s: Object.assign({}, p.s), fr: 0 }));
  S = { me: 0, day: 1, cond: 80, scout: 0, round: 0, shownTips: false, wins: 0 };
}
const meP = () => roster[S.me];
const condMult = () => 0.86 + 0.18 * (S.cond / 100);
function addStat(k, v) { const p = meP(); p.s[k] = Math.min(10, +(p.s[k] + v).toFixed(2)); }
function addCond(v) { S.cond = clamp(S.cond + v, 0, 100); }
const fmt = v => (Math.round(v * 10) / 10).toFixed(1);

/* ---------- 3D: 캠프 장면 ---------- */
const campGroup = new THREE.Group(); scene.add(campGroup);
let campModels = [], meRing = null;
function buildCamp() {
  campGroup.clear(); campModels = [];
  roster.forEach((p, i) => {
    const m = makePerson(p.color, '#14283d', null, p.name); const a = i / roster.length * Math.PI * 2 + .3;
    m.position.set(Math.sin(a) * 4.2, .32, -11 + Math.cos(a) * 4.2); m.userData.home = m.position.clone(); faceTo(m, 0, -11);
    campGroup.add(m); campModels.push(m);
  });
  const c = new THREE.Mesh(new THREE.CircleGeometry(1.2, 20), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .0 })); campGroup.add(c);
}
function markMe() {
  if (meRing && meRing.parent) meRing.parent.remove(meRing);
  meRing = makeRing(0xffc531); meRing.scale.set(1.2, 1.2, 1.2); campModels[S.me].add(meRing);
}
const camp = { angle: 0.4, on: true };

/* ---------- 3D: 경기 장면 ---------- */
const matchGroup = new THREE.Group(); scene.add(matchGroup); matchGroup.visible = false;
const FIELD_POS = [[10.3, -13.5], [6, -19.5], [-6, -19.5], [-10.3, -13.5], [-22, -32], [0, -38], [22, -32]];
let fielders = [], pitcherM, batterM, batM, catcherM, umpM, runnersM = [], pitcherRing;
const ball = new THREE.Mesh(new THREE.SphereGeometry(.085, 14, 10), new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x2a2a2a }));
ball.castShadow = true; ball.visible = false; scene.add(ball);
function buildMatchScene() {
  fielders = FIELD_POS.map(([x, z]) => { const m = makePerson('#e5484d', '#8f1d22'); m.position.set(x, 0, z); m.userData.home = m.position.clone(); faceTo(m, 0, 0); matchGroup.add(m); return m; });
  pitcherM = makePerson('#e5484d', '#8f1d22'); pitcherM.position.set(0, .32, -11); faceTo(pitcherM, 0, 0); matchGroup.add(pitcherM);
  pitcherRing = makeRing(0xffc531); pitcherM.add(pitcherRing);
  batterM = makePerson('#2f6fed', '#1c3d8f', null, null, 1); batterM.position.set(-.85, 0, .05); batterM.rotation.y = Math.PI / 2; matchGroup.add(batterM);
  batM = setupBatRig(batterM); resetBat();
  catcherM = makePerson('#2f6fed', '#1c3d8f'); catcherM.position.set(0, -.12, 1.0); catcherM.scale.y = .78; catcherM.rotation.y = Math.PI; matchGroup.add(catcherM);
  umpM = makePerson('#222', '#111', '#333'); umpM.position.set(0, 0, 1.9); umpM.rotation.y = Math.PI; matchGroup.add(umpM);
  for (let i = 0; i < 3; i++) { const r = makePerson('#2f6fed', '#1c3d8f', null, null, 1); r.position.set(BASES[i].x * .85, 0, BASES[i].z + .5); faceTo(r, BASES[i].x, BASES[i].z - 2); r.visible = false; matchGroup.add(r); runnersM.push(r); }
}
function resetBat() { batM.parent.parent.rotation.y = -.75; batM.rotation.set(-.35, 0, -.3); }
function swingBat(){if(batM.userData.busy)return;batM.userData.busy=true;const r=batM.parent.parent;
  tween(.17,k=>{r.rotation.y=lerp(-.9,1.05,k);batM.rotation.z=lerp(-.3,0,k);batM.rotation.x=lerp(-.35,1.3,k)},easeIO)
  .then(()=>tween(.15,k=>{r.rotation.y=lerp(1.05,1.7,k);batM.rotation.x=lerp(1.3,.9,k)}))
  .then(()=>tween(.4,k=>{r.rotation.y=lerp(1.7,-.75,k);batM.rotation.z=lerp(0,-.3,k);batM.rotation.x=lerp(.9,-.35,k)}))
  .then(()=>{batM.userData.busy=false})}
function windup(model) {
  const arm = model.userData.armR;
  return tween(.42, k => { arm.rotation.x = -2.9 * k; }, easeIO).then(() => { tween(.25, k => { arm.rotation.x = lerp(-2.9, -.2, k); }); });
}
function showCatcher(v) { catcherM.visible = v; umpM.visible = v; }

const cursor = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let swingCb = null, throwCb = null;
window.addEventListener('pointermove', e => { cursor.x = e.clientX; cursor.y = e.clientY; const r = $('#reticle'); if (!r.classList.contains('hidden')) { r.style.left = cursor.x + 'px'; r.style.top = cursor.y + 'px'; } });
canvas.addEventListener('pointerdown', e => { cursor.x = e.clientX; cursor.y = e.clientY; if (swingCb) swingCb(e.clientX, e.clientY); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (swingCb) swingCb(cursor.x, cursor.y); else if (throwCb && !subOpen) throwCb(); }

  else if (q < 0.84) w = { foul: .05, out_g: .08, out_f: .12, single: .40 + c, double: .25 + p / 2, hr: .10 + p };

 spdEl.classList.remove('hidden');clearTimeout(_spT);_spT=setTimeout(()=>spdEl.classList.add('hidden'),2600)}catch(e){}}
/* ===== 투수 교체 / 대타 교체 ===== */
const subBtn=document.createElement('button');subBtn.id='subBtn';subBtn.className='hidden';$('#batterCard').appendChild(subBtn);
let subOpen=false,skipBat=false;
function subUpd(){const w=M&&!M.practice&&M.subWin;subBtn.classList.toggle('hidden',!w);if(w)subBtn.textContent=w==='bat'?'🔁 대타 교체':'🔁 투수 교체'}
subBtn.onclick=async()=>{if(!M||!M.subWin||subOpen)return;subOpen=true;try{if(M.subWin==='bat')await subBat();else await subPit()}catch(e){console.error(e)}subOpen=false;updateHUD();subUpd()};
canvas.addEventListener('pointerdown',()=>{if(M&&M.subWin==='bat'&&!subOpen)skipBat=true});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&M&&M.subWin==='bat'&&!subOpen)skipBat=true});
function mkBat(p){return{ref:p,name:p.name,ours:true,buff:1,
 get s(){return this.buff?Object.assign({},p.s,{con:Math.min(10,(p.s.con||4)+1.5),pow:Math.min(10,(p.s.pow||4)+1.5)}):p.s},
 get con(){return Math.min(10,eff(p,'con')+(this.buff?1.5:0))},get pow(){return Math.min(10,eff(p,'pow')+(this.buff?1.5:0))},
 get spd(){return eff(p,'spd')},get eye(){return Math.min(10,eff(p,'eye')+(this.buff?1:0))}}}
const benchOf=()=>{const lu=M.us.lineup;return team().filter(p=>!isPit(p)&&!lu.some(x=>x.ref===p)&&!(M.outB&&M.outB.has(p)))};
async function preBat(){const h=$('#hint').textContent;
 if(M.balls||M.strikes||M.practice||!benchOf().length){M.subWin=null;subUpd();await sleep(rnd(450,800));return}
 M.subWin='bat';subUpd();skipBat=false;setHint('🔁 왼쪽 아래 버튼으로 대타 교체 가능 · 화면을 누르면 바로 시작');
 let t=0;while(subOpen||(t<1800&&!skipBat)){await sleep(100);if(!subOpen)t+=100}
 M.subWin=null;subUpd();setHint(h)}
async function subBat(){const lu=M.us.lineup,cur=lu[M.us.idx],bn=benchOf();
 if(!bn.length){await modal('<h2>교체할 타자가 없어요</h2><p>벤치에 남은 타자가 없습니다.</p>',[{t:'확인'}]);return}
 const i=await modal(`<h2>🔁 대타 교체</h2><p><b>${cur.name}</b> 대신 나갈 타자를 고르세요.<br>대타는 <b>이번 타석 한 번</b> 컨택·파워·선구안이 오르는 버프를 받아요. 교체된 선수는 다시 나올 수 없어요.</p>`,
  bn.map(p=>({t:`${p.name} · 컨${fmt(eff(p,'con'))} 파${fmt(eff(p,'pow'))} 속${fmt(eff(p,'spd'))}`})).concat([{t:'취소',cls:'alt'}]));
 if(i>=bn.length)return;const p=bn[i];M.outB=M.outB||new Set();if(cur.ref)M.outB.add(cur.ref);
 lu[M.us.idx]=mkBat(p);SFX.jingle();updateHUD();await callBanner('대타 '+p.name+'!','run',900)}
async function subPit(){const cur=pit();M.usedP=M.usedP||new Set();
 const c=team().filter(q=>isPit(q)&&q!==cur&&!M.usedP.has(q));
 if(!c.length){await modal('<h2>교체할 투수가 없어요</h2><p>등판 가능한 투수가 더 없습니다.</p>',[{t:'확인'}]);return}
 const i=await modal(`<h2>🔁 투수 교체</h2><p><b>${cur.name}</b> 대신 올릴 투수를 고르세요.<br>새 투수는 <b>처음 공 3개</b> 동안 구위·제구 버프를 받고 체력도 새로 시작해요. 교체된 투수는 다시 나올 수 없어요.</p>`,
  c.map(q=>({t:`${q.name} · 구${fmt(eff(q,'stf'))} 제${fmt(eff(q,'ctl'))} 체${fmt(eff(q,'sta'))}`})).concat([{t:'취소',cls:'alt'}]));
 if(i>=c.length)return;M.usedP.add(cur);S.pitcher=c[i];M.pBase=M.pitches;M.pBuff=3;SFX.jingle();updateHUD();await callBanner('투수 교체 · '+c[i].name,'run',1000)}
initControls();
document.addEventListener('visibilitychange',()=>{if(audioCtx)try{document.hidden?audioCtx.suspend():audioCtx.resume()}catch(e){}});
['contextmenu','gesturestart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
boot();
</script>
</body>
</html>
